<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CZHUB24 — крупнейшее русскоязычное сообщество Чехии. Работа, жильё, фушки, маркет, авто и услуги в одном переходнике."
    />
    <meta
      name="keywords"
      content="работа в Чехии, жильё в Чехии, фушки в Чехии, русскоязычное сообщество Чехии"
    />
    <meta name="theme-color" content="#05070d" />
    <title>CZHUB24 — переходник сообщества</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <main class="page-shell">
      <div class="top-controls">
        <div class="lang-switch" role="group" aria-label="Язык">
          <button id="btn-ru" class="lang-btn" data-lang="ru">RU</button>
          <button id="btn-ua" class="lang-btn" data-lang="ua">UA</button>
        </div>
      </div>
      <section class="hero-card" aria-labelledby="hero-title">
        <div class="logo-wrap">
          <img src="./assets/logo.png" alt="CZHUB24 logo" class="logo-image" onerror="this.style.display='none'"/>
          <div class="logo-fallback" aria-hidden="true">CZHUB24</div>
          <div class="chrome-shimmer" aria-hidden="true"></div>
        </div>
        <p class="eyebrow" id="eyebrow">Крупнейшее русскоязычное сообщество Чехии • Російсько-українська спільнота Чехії</p>
        <h1 id="hero-title">Выберите платформу сообщества</h1>

        <div id="platform-buttons" class="platform-grid" aria-label="Платформы сообщества"></div>

        <p class="description">
          Работа • Жильё • Фушки • Маркет • Авто • Услуги
        </p>
      </section>

      <section class="projects-card" aria-labelledby="projects-title">
        <div class="section-heading">
          <p class="section-label">Наши проекты</p>
          <h2 id="projects-title">Будущие сообщества и направления</h2>
        </div>
        <div id="projects-list" class="projects-list"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
